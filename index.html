<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WHAT IF MAP CREATOR</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="imgs/icon2.ico"> 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body id="bodi">

    <nav id="toolbar" class="fixed-top navbar">

        <!-- fila superior-->
        <div class="toolbar-row toolbar-row--bottom toolbar">

            <button class="btn-toolbar" id="clearButton">Clear Map</button>
            <button class="btn-toolbar" id="saveButton">Save Map</button>
            <button class="btn-toolbar" id="loadButton">Load Map</button>

            <div class="input_container">
                <label for="loadCustomMap" class="btn-toolbar">Browse Files</label>
                <input id="loadCustomMap" style="display:none;" type="file">
            </div>

            <button class="btn-toolbar" id="saveIMGButton">Save IMG</button>
            

            <button class="btn-toolbar" id="OptionsButton">Options</button>

            <button class="btn-toolbar" data-ajustar="">Ajustar Imagen</button>

            <button class="btn-toolbar" id="loadSaveButton">Load Save</button>

            <div class="input_container">
                <label for="loadSaveMap" class="btn-toolbar">Browse Files</label>
                <input id="loadSaveMap" style="display:none;" type="file">
            </div>

        </div>

        <!-- fila inferior-->
        <div class="toolbar-row toolbar-row--top">
            <!-- PINCEL + LISTA DE PAÍSES -->
            <div class="dropdown" id="brushDropdownWrapper">
                <button class="btn btn-secondary dropdown-toggle d-flex align-items-center gap-2"
                        id="countryDropdown"
                        data-bs-toggle="dropdown"
                        data-bs-auto-close="outside"
                        aria-expanded="false">
                    <span class="brush-swatch" id="brushColorDisplay"></span>
                    <span class="text-nowrap">Color</span>
                </button>

                <div class="dropdown-menu country-panel p-0" aria-labelledby="countryDropdown">
                    <div class="country-panel__header">
                        <span>Países</span>
                        <div class="country-new-color">
                            <label for="brushColor" class="country-new-label">Nuevo color:</label>
                            <input type="color" id="brushColor" value="#ff0000" title="Elegir nuevo color de pincel" />
                            <button class="btn btn-xs btn-outline-light" id="addCountryBtn">+ Agregar</button>
                        </div>
                    </div>
                    <ul class="country-list" id="countryList">
                        <li class="country-empty">Todavía no hay países. Pintá una provincia para empezar.</li>
                    </ul>
                </div>
            </div>



            <button class="btn-toolbar" id="ConfirmEditButton">Confirmar</button>
            <button class="btn-toolbar" id="CancelEditButton">Cancelar</button>

            <form class="radio-group">
                <input type="radio" id="FillCountry" name="choice" value="1">
                <label class="btn-toolbar" for="FillCountry">Fill Country</label><br>

                <input type="radio" id="FillContinuity" name="choice" value="2">
                <label class="btn-toolbar" for="FillContinuity">Fill Continuity</label>
            </form>

        </div>
    </nav>

    <div id="optionsPopup" class="popup hidden">
        <div class="popup-content">
            <h3>Opciones</h3>

            <button class="btn-toolbar" id="ChangeToStockButton">Change to Stock Map</button>
            <button class="btn-toolbar" id="ChangeToGFMButton">Change to Victoria 2 GFM</button>
            <button class="btn-toolbar" id="ChangeToEU4Button">Change to Europa Universalis 4</button>



            <span class="text-nowrap">Color del Agua:</span>
            <input type="color" id="waterColor" class="water-color-input" value="#9591df">
            <div class="opacity-control">
                <span class="text-nowrap">Opacidad:</span>
                <input type="range" id="opacitySlider" min="0" max="100" value="70" step="5" class="opacity-slider" />
                <span id="opacityLabel" class="opacity-label">70%</span>
            </div>
            <button class="btn-toolbar" id="WrapButton">Wrap</button>
            
            <button class="btn-toolbar" id="closePopup">Cerrar</button>
        </div>
    </div>

    <div class="sidebar">
        <nav>
            <ul>
                <li>
                    <a href="#" id="SelectButton" title="Seleccionar">
                        <img src="imgs/hand.png" alt="Selección">
                    </a>
                </li>
                <li>
                    <a href="#" id="PaintButton" title="Pintar">
                        <img src="imgs/Icon_scheme_convert_to_witchcraft.png" alt="Pincel">
                    </a>
                </li>
                <li>
                    <a href="#" id="EraserButton" title="Borrar">
                        <img src="imgs/120px-Invention_flamethrowers.png" alt="Borrar">
                    </a>
                </li>
                <li>
                    <a href="#" id="InkWellButton" title="Tintero">
                        <img src="imgs/Diplomacy_declare_interest.png" alt="Tintero">
                    </a>
                </li>
                <li>
                    <a href="#" id="LassoButton" title="Lazo">
                        <img src="imgs/Huntperson_camp_officer.png" alt="Lazo">
                    </a>
                </li>
                <li>
                    <a href="#" id="BucketButton" title="Balde">
                        <img src="imgs/120px-Pop_bureaucrats.png" alt="Balde">
                    <!--<img src="imgs/120px-Goods_porcelain.png" alt="Balde">-->
                    </a>
                </li>
                <li>
                    <a href="#" id="CutButton" title="Recortar">
                        <img src="imgs/120px-Struggle_persia_phase_stabilisation.png" alt="Recortar">
                    </a>
                </li>
                <li>
                    <a href="#" id="EditorModeButton" title="Modo Editor">
                        <img src="imgs/Activity_survey.png" alt="EditorMode">
                    </a>
                </li>
                <li>
                    <a href="#" title="Placeholder">
                        <img src="imgs/placeholder.png" alt="Placeholder">
                    </a>
                </li>

            </ul>
        </nav>
    </div>

    <div class="refPanel">
        <div class="ref-add">
            <span>➕</span>
            <input type="file" id="AddRefImage" accept="image/*">
        </div>

        <div class="refList" id="RefList"></div>

        <template id="RefItemTemplate">
            <div class="refImage">
                <img class="ref-preview" alt="Referencia">
                <div class="refImageButtons">
                    <button class="ref-delete" title="Eliminar Imagen">❌</button>
                    <button class="ref-hide"   title="Ocultar Imagen">👁</button>
                    <button class="ref-block"  title="Bloquar Imagen">🔓</button>
                    <button class="ref-blur"   title="Pixelar Imagen">🔍</button>
                </div>
                <div class="opacity-control">
                    <input type="range" class="opacity-slider ref-opacity" min="0" max="100" value="100" step="5">
                    <span class="opacity-label ref-opacity-label">100%</span>
                </div>
            </div>
        </template>
    </div>

    <div class="sidebar othersidebar">
        <nav>
            <ul>
                <!-- Sección País -->
                <li class="info-section">
                    <span class="info-section__title">País</span>

                    <!-- Bandera -->
                    <div class="flag-wrapper" style="margin-bottom: 10px;">
                        <img id="CountryFlagPreview" src="imgs/placeholder.png" alt="Bandera">
                        <input id="CountryFlag" type="file" accept="image/*">
                    </div>

                    <div class="info-row">
                        <span class="info-label">Nombre</span>
                        <input id="CountryName" class="info-input" type="text" placeholder="—">
                    </div>
                    <div class="info-row">
                        <span class="info-label">Color</span>
                        <input id="CountryColor" type="color" class="country-color-picker">
                    </div>
                    <div class="info-row">
                        <span class="info-label">Bloqueado</span>
                        <label class="lock-toggle">
                            <input id="CountryLocked" type="checkbox">
                            <span class="lock-slider"></span>
                        </label>
                    </div>
                </li>

                <!-- Sección Provincia -->
                <li class="info-section">
                    <span class="info-section__title">Provincia</span>

                    <div class="info-columns">
                        <div class="info-col">
                            <div class="info-row">
                                <span class="info-label">ID</span>
                                <span id="ProvinceId" class="info-value">—</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Nombre</span>
                                <input id="ProvinceName" class="info-input" type="text" placeholder="—">
                            </div>
                            <div class="info-row">
                                <span class="info-label">Bien comercial</span>
                                <div id="ProvinceTradeGoods"></div>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Religión</span>
                                <div id="ProvinceReligion"></div>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Cultura</span>
                                <div id="ProvinceCulture"></div>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Es agua</span>
                                <input id="ProvinceIsWater" type="checkbox">
                            </div>
                        </div>

                        <div class="info-col info-col--dev">
                            <div class="dev-row" title="Impuestos">
                                <img class="dev-icon" src="imgs/icons/tax.png" alt="Impuestos">
                                <input id="ProvinceBaseTax" class="info-input" type="number" min="0" placeholder="—">
                            </div>
                            <div class="dev-row" title="Producción">
                                <img class="dev-icon" src="imgs/icons/production.png" alt="Producción">
                                <input id="ProvinceBaseProduction" class="info-input" type="number" min="0" placeholder="—">
                            </div>
                            <div class="dev-row" title="Manpower">
                                <img class="dev-icon" src="imgs/icons/manpower.png" alt="Manpower">
                                <input id="ProvinceBaseManpower" class="info-input" type="number" min="0" placeholder="—">
                            </div>
                            <div class="dev-row" title="Desarrollo total">
                                <img class="dev-icon" src="imgs/icons/development.png" alt="Desarrollo total">
                                <span id="ProvinceDevelopment" class="info-value">—</span>
                            </div>
                        </div>
                    </div>
                </li>

                <!-- Vista previa del mapa -->
                <li class="info-section">
                    <span class="info-section__title">Vista Previa</span>
                    <canvas id="mapPreview"></canvas>
                </li>

            </ul>
        </nav>
    </div>

    <canvas id="mapCanvas" width="800" height="600"></canvas>
    

    
    <div id="references">
        <template id="referenceImg">
            <div class="reference-image">
                <img src="" alt="Referencia">

                <div class="resizeButtons">
                    <button type="button" class="ref-resize ref-resize-nw">↖️</button>
                    <button type="button" class="ref-resize ref-resize-ne">↗️</button>
                    <button type="button" class="ref-resize ref-resize-sw">↙️</button>
                    <button type="button" class="ref-resize ref-resize-se">↘️</button>
                </div>
            </div>
        </template>
    </div>

    <aside id="panel-ajuste"
        role="dialog"
        aria-label="Ajustar imagen de referencia"
        hidden>

        <div id="panel-titulo">
            <span id="panel-nombre">Ajustar</span>
            <button type="button" id="panel-cerrar" aria-label="Cerrar">✕</button>
        </div>

        <div id="panel-cuerpo">
            <div id="distorsionator-ui">

                <div>
                    <label for="dist-image">Imagen original</label>
                    <div class="dist-row">
                        <select id="dist-image"></select>
                        <button type="button" id="dist-refresh">Actualizar</button>
                    </div>
                </div>

                <div>
                    <div class="dist-status" id="dist-instructions"></div>
                    <div class="dist-row">
                        <select id="dist-role">
                            <option value="m1">Meridiano 1</option>
                            <option value="m2">Meridiano 2</option>
                            <option value="p1">Paralelo 1</option>
                            <option value="p2">Paralelo 2</option>
                            <option value="a">Referencia (sin línea)</option>
                        </select>
                    </div>
                    <div class="dist-row">
                        <button type="button" id="dist-source">Punto en imagen</button>
                        <button type="button" id="dist-target">Punto en mapa</button>
                    </div>
                </div>

                <div>
                    <label for="dist-zoom">Zoom de la imagen</label>
                    <input type="range" id="dist-zoom" min="100" max="500" step="25" value="100">

                    <div id="dist-preview" style="display:none; overflow:auto; max-height:55vh; border:1px solid #555; margin-top:6px;">
                        <div id="dist-preview-inner" style="position:relative; width:100%; line-height:0;">
                            <img id="dist-preview-img" alt="Imagen a ajustar" draggable="false"
                                 style="display:block; width:100%; height:auto; cursor:crosshair; user-select:none;">
                            <div id="dist-preview-markers"
                                 style="position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none;"></div>
                        </div>
                    </div>
                </div>

                <div class="dist-row">
                    <button type="button" id="dist-delete">Eliminar punto</button>
                    <button type="button" id="dist-export">Exportar JSON</button>
                    
                    <button type="button" id="dist-warp">
                        Generar imagen rectangular
                    </button>

                    <div id="dist-warp-result"></div>
                </div>

                <div id="dist-status" class="dist-status"></div>

                <!-- JavaScript genera las filas de puntos -->
                <div id="dist-points"></div>

                <!-- JavaScript muestra el JSON exportado -->
                <pre id="dist-output"></pre>

            </div>
        </div>
    </aside>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="module" src="main.js"></script>
    <script type="module" src="distorsionator.js"></script>
    <script>
        document.querySelectorAll(".dev-icon").forEach(img => {
            img.addEventListener("error", () => {
                if (!img.src.endsWith("imgs/placeholder.png")) img.src = "imgs/placeholder.png";
            });
        });
    </script>
</body>
</html>
